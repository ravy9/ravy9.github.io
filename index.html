<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi niña hermosa ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            z-index: 10;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        h1 { color: #d63384; font-size: 2.2rem; margin-bottom: 10px; }

        /* Estilo para las fotos */
        .fotos-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .foto {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .foto:hover { transform: scale(1.1) rotate(5deg); }

        .buttons {
            margin-top: 30px;
            position: relative;
            height: 100px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #si { background-color: #ff4d6d; color: white; box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4); }
        #no { background-color: #adb5bd; color: white; position: absolute; }

        /* Animación de corazones */
        .corazon {
            position: fixed;
            top: -1vh;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh); }
        }

        #mensaje-final {
            display: none;
            font-size: 1.8rem;
            color: #ff4d6d;
            animation: aparecer 1s ease-in;
        }

        @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <audio id="musica" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="fotos-container">
            <img src="foto1.jpg" alt="Nosotros" class="foto">
            <img src="foto2.jpg" alt="Nosotros" class="foto">
            <img src="foto3.jpg" alt="Nosotros" class="foto">
        </div>

        <div id="contenido-inicial">
            <h1>¿Quieres ser mi novia? ❤️</h1>
            <p>Eres lo mejor que me ha pasado...</p>
            <div class="buttons">
                <button id="si">SÍ, ACEPTO</button>
                <button id="no">No</button>
            </div>
        </div>

        <div id="mensaje-final">
            <h1>¡SIII! 😍</h1>
            <p>Prometo hacerte la persona más feliz del mundo. ¡Te amo!</p>
            <p style="font-size: 50px;">✨💖✨</p>
        </div>
    </div>

    <script>
        const btnNo = document.querySelector('#no');
        const btnSi = document.querySelector('#si');
        const musica = document.getElementById('musica');

        // Mover el botón "No"
        btnNo.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        });

        // Al hacer clic en SI
        btnSi.addEventListener('click', () => {
            document.getElementById('contenido-inicial').style.display = 'none';
            document.getElementById('mensaje-final').style.display = 'block';
            musica.play(); // Inicia la música
            lanzarCorazones();
        });

        // Lluvia de corazones
        function lanzarCorazones() {
            setInterval(() => {
                const corazon = document.createElement('div');
                corazon.classList.add('corazon');
                corazon.innerText = "❤️";
                corazon.style.left = Math.random() * 100 + "vw";
                corazon.style.animationDuration = Math.random() * 2 + 3 + "s";
                document.body.appendChild(corazon);
                setTimeout(() => corazon.remove(), 5000);
            }, 300);
        }
    </script>
</body>
</html>
